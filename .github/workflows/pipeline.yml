name: Manage SSH Keys on Nodes

on:
  push:
    paths:
      - 'group_vars/all/ssh-keys.yml'
    branches:
      - main

jobs:
  ansible:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Ansible dry run
        run: |
          ansible-playbook -i inventory/hosts.yml playbook.yml --check --diff

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i inventory/hosts.yml playbook.yml -v